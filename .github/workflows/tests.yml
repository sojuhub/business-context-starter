name: Local package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-18
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-09-18
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit, CLI and static contract checks
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q scripts plugins/business-context-starter/scripts tests
